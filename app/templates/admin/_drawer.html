{% from "partials/macros.html" import icon %}
{# Drawer geser untuk form tambah/edit. Isi field diberikan lewat {% call drawer() %}...{% endcall %} #}
{% macro drawer(id='drawer') -%}
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="drawer" id="{{ id }}" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="{{ id }}-title">
  <form method="post" action="" style="display:flex;flex-direction:column;height:100%;min-height:0" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="drawer-head">
      <h2 id="{{ id }}-title" data-drawer-title></h2>
      <button type="button" class="drawer-close" data-drawer-close aria-label="Tutup panel">{{ icon('x') }}</button>
    </div>
    <div class="drawer-body">{{ caller() }}</div>
    <div class="drawer-foot">
      <button type="button" class="btn btn-ghost" data-drawer-close>Batal</button>
      <button class="btn btn-primary" type="submit" data-drawer-submit>Simpan</button>
    </div>
  </form>
</div>
{%- endmacro %}
